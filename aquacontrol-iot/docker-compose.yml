services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-u", "${MQTT_USERNAME}", "-P", "${MQTT_PASSWORD}", "-t", "healthcheck", "-m", "ping", "-i", "healthcheck-client"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MQTT_BROKER_HOST: mosquitto
    command: sh -c "python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true)"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MQTT_BROKER_HOST: mosquitto
    volumes:
      - media_data:/app/media
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt

  mqtt_listener:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MQTT_BROKER_HOST: mosquitto
    command: python manage.py run_mqtt_listener
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__/"
            - "**/*.pyc"
        - action: rebuild
          path: ./backend/requirements.txt

  # --- Simulación sin hardware (en la maqueta real, estos 3 corren en el ESP32 y la Raspberry Pi) ---

  # Simula el ESP32 de calidad de agua (pH, turbiedad, cloro, temperatura, OD)
  simulator:
    build: ./simulator
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_BROKER_HOST: mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy

  # PLC simulado (servidor Modbus TCP) — en la maqueta corre en la Raspberry Pi
  plc_sim:
    build: ./raspberry
    restart: unless-stopped
    command: python plc_simulado.py --port 5020

  # Gateway Modbus TCP <-> MQTT — en la maqueta corre en la Raspberry Pi
  gateway:
    build: ./raspberry
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      PLC_HOST: plc_sim
      PLC_PORT: 5020
    depends_on:
      mosquitto:
        condition: service_healthy
      plc_sim:
        condition: service_started

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  media_data:
